<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Arborist icon</title>
  <desc id="desc">A tree with green leaves, golden trunk, and circuit-board roots.</desc>
  <defs>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c68c2e" />
      <stop offset="1" stop-color="#8b5e1a" />
    </linearGradient>
    <linearGradient id="leaf-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4caf50" />
      <stop offset="1" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="leaf-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8bc34a" />
      <stop offset="1" stop-color="#558b2f" />
    </linearGradient>
    <linearGradient id="leaf-bright" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aed581" />
      <stop offset="1" stop-color="#7cb342" />
    </linearGradient>
  </defs>
  <!-- Trunk and branches -->
  <path d="M64 75 V58 C64 50 60 44 56 38 C52 32 46 28 42 26" stroke="url(#trunk)" stroke-width="5" fill="none" stroke-linecap="round" />
  <path d="M64 75 V58 C64 50 68 44 72 38 C76 32 82 28 86 26" stroke="url(#trunk)" stroke-width="5" fill="none" stroke-linecap="round" />
  <path d="M64 65 C60 58 54 54 48 50" stroke="url(#trunk)" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M64 65 C68 58 74 54 80 50" stroke="url(#trunk)" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M64 58 C62 52 58 48 54 44" stroke="url(#trunk)" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <path d="M64 58 C66 52 70 48 74 44" stroke="url(#trunk)" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <path d="M64 70 C58 66 52 64 46 62" stroke="url(#trunk)" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M64 70 C70 66 76 64 82 62" stroke="url(#trunk)" stroke-width="3" fill="none" stroke-linecap="round" />
  <!-- Main trunk -->
  <path d="M64 75 V80" stroke="url(#trunk)" stroke-width="6" fill="none" stroke-linecap="round" />
  <!-- Ground line -->
  <path d="M38 80 H90" stroke="#4caf50" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
  <!-- Circuit-board roots -->
  <path d="M64 80 V90 L48 102" stroke="url(#trunk)" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M64 80 V88 L78 100" stroke="url(#trunk)" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M64 85 L40 98" stroke="url(#trunk)" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M64 85 L88 98" stroke="url(#trunk)" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M52 95 V108" stroke="url(#trunk)" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M76 95 V108" stroke="url(#trunk)" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M48 102 H36" stroke="url(#trunk)" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M78 100 H92" stroke="url(#trunk)" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M40 98 L34 108" stroke="url(#trunk)" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M88 98 L94 108" stroke="url(#trunk)" stroke-width="2" fill="none" stroke-linecap="round" />
  <!-- Root circuit pads -->
  <circle cx="36" cy="102" r="3.5" fill="#c9a832" />
  <circle cx="48" cy="102" r="3.5" fill="#c9a832" />
  <circle cx="78" cy="100" r="3.5" fill="#c9a832" />
  <circle cx="92" cy="100" r="3.5" fill="#c9a832" />
  <circle cx="52" cy="108" r="3.5" fill="#c9a832" />
  <circle cx="76" cy="108" r="3.5" fill="#c9a832" />
  <circle cx="34" cy="108" r="3.5" fill="#c9a832" />
  <circle cx="94" cy="108" r="3.5" fill="#c9a832" />
  <!-- Leaves - outer ring -->
  <ellipse cx="38" cy="24" rx="7" ry="4.5" transform="rotate(-40 38 24)" fill="url(#leaf-dark)" />
  <ellipse cx="30" cy="32" rx="7" ry="4.5" transform="rotate(-60 30 32)" fill="url(#leaf-dark)" />
  <ellipse cx="28" cy="44" rx="7" ry="4.5" transform="rotate(-70 28 44)" fill="url(#leaf-light)" />
  <ellipse cx="32" cy="56" rx="7" ry="4.5" transform="rotate(-50 32 56)" fill="url(#leaf-dark)" />
  <ellipse cx="40" cy="64" rx="7" ry="4.5" transform="rotate(-30 40 64)" fill="url(#leaf-light)" />
  <ellipse cx="90" cy="24" rx="7" ry="4.5" transform="rotate(40 90 24)" fill="url(#leaf-light)" />
  <ellipse cx="98" cy="32" rx="7" ry="4.5" transform="rotate(60 98 32)" fill="url(#leaf-bright)" />
  <ellipse cx="100" cy="44" rx="7" ry="4.5" transform="rotate(70 100 44)" fill="url(#leaf-light)" />
  <ellipse cx="96" cy="56" rx="7" ry="4.5" transform="rotate(50 96 56)" fill="url(#leaf-dark)" />
  <ellipse cx="88" cy="64" rx="7" ry="4.5" transform="rotate(30 88 64)" fill="url(#leaf-light)" />
  <!-- Leaves - middle ring -->
  <ellipse cx="46" cy="18" rx="6.5" ry="4" transform="rotate(-20 46 18)" fill="url(#leaf-bright)" />
  <ellipse cx="82" cy="18" rx="6.5" ry="4" transform="rotate(20 82 18)" fill="url(#leaf-bright)" />
  <ellipse cx="36" cy="40" rx="6.5" ry="4" transform="rotate(-55 36 40)" fill="url(#leaf-bright)" />
  <ellipse cx="92" cy="40" rx="6.5" ry="4" transform="rotate(55 92 40)" fill="url(#leaf-dark)" />
  <ellipse cx="44" cy="52" rx="6" ry="3.5" transform="rotate(-35 44 52)" fill="url(#leaf-bright)" />
  <ellipse cx="84" cy="52" rx="6" ry="3.5" transform="rotate(35 84 52)" fill="url(#leaf-bright)" />
  <!-- Leaves - inner/top -->
  <ellipse cx="54" cy="14" rx="6" ry="3.5" transform="rotate(-10 54 14)" fill="url(#leaf-light)" />
  <ellipse cx="74" cy="14" rx="6" ry="3.5" transform="rotate(10 74 14)" fill="url(#leaf-light)" />
  <ellipse cx="64" cy="12" rx="6" ry="4" fill="url(#leaf-bright)" />
  <ellipse cx="50" cy="28" rx="6" ry="3.5" transform="rotate(-25 50 28)" fill="url(#leaf-light)" />
  <ellipse cx="78" cy="28" rx="6" ry="3.5" transform="rotate(25 78 28)" fill="url(#leaf-dark)" />
  <ellipse cx="56" cy="38" rx="5.5" ry="3.5" transform="rotate(-15 56 38)" fill="url(#leaf-dark)" />
  <ellipse cx="72" cy="38" rx="5.5" ry="3.5" transform="rotate(15 72 38)" fill="url(#leaf-light)" />
  <ellipse cx="64" cy="22" rx="5.5" ry="3.5" fill="url(#leaf-dark)" />
</svg>
