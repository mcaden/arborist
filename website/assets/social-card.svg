      <ellipse cx="78" cy="28" rx="6" ry="3.5" transform="rotate(25 78 28)" fill="#2e7d32" />
      <ellipse cx="56" cy="38" rx="5.5" ry="3.5" transform="rotate(-15 56 38)" fill="#2e7d32" />
      <ellipse cx="72" cy="38" rx="5.5" ry="3.5" transform="rotate(15 72 38)" fill="#8bc34a" />
