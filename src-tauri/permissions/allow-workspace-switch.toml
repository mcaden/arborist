"$schema" = "../gen/schemas/desktop-schema.json"

[[permission]]
identifier = "allow-workspace-switch"
description = "Allows the frontend to swap the active workspace at runtime via the `workspace_switch` command (Phase 7). Closes every open session in the current workspace, releases its OS lock, then binds the new workspace's lock and `ConfigStore`."
commands.allow = [
    "workspace_switch",
]
