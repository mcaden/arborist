[package]
name = "arborist"
version = "0.1.7"
edition = "2021"
description = "Cross-platform desktop app for managing AI coding-assistant sessions across Git worktrees."
authors = ["Aaron Moore", "Arborist contributors"]
license = "MIT"
repository = "https://github.com/mcaden/arborist"
homepage = "https://arborist.tools"
readme = "../README.md"
publish = false
default-run = "arborist"

[lib]
name = "arborist_lib"
path = "src/lib.rs"

[[bin]]
name = "arborist"
path = "src/main.rs"

# Purpose-built deterministic child process used by the PTY-pool integration
# tests (`tests/pty_pool.rs`). Gated behind the `test-helpers` feature so
# `cargo build`/`cargo test` without the feature skip it. Cargo exposes the
# built path via `CARGO_BIN_EXE_arborist-test-child`.
#
# The `path` deliberately points outside `src/bin/`: Tauri's CLI does an
# unconditional `read_dir` of `src/bin/` and adds every file there as a
# bundle binary regardless of `required-features`, which then causes
# `tauri build` to fail trying to copy a binary that wasn't built (or to
# ship test helpers in the production AppImage / .deb / .app). Keeping the
# source in `src/test_bin/` is what keeps `tauri build` clean. Do not move
# these files back into `src/bin/`.
[[bin]]
name = "arborist-test-child"
path = "src/test_bin/arborist_test_child.rs"
required-features = ["test-helpers"]

# Helper used by `tests/workspace_lock_multiprocess.rs` to verify that
# cross-process contention on `WorkspaceLockGuard` produces
# `LockError::Contention`. Same convention as the test child above —
# including the `src/test_bin/` location for the same Tauri-bundler reason.
[[bin]]
name = "arborist-test-locker"
path = "src/test_bin/arborist_test_locker.rs"
required-features = ["test-helpers"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-store = "2.4"
tauri-plugin-dialog = "2.7"
arborist-types = { path = "../crates/arborist-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "rt-multi-thread", "process", "io-util"] }
portable-pty = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
dunce = "1"
sha2 = "0.10"
fs2 = "0.4"
# `rfd` is used directly for boot-time dialogs and the runtime `dialog_pick_directory`
# command. Keep `default-features = false` and explicitly enable `gtk3` to avoid
# backend auto-selection surprises on Linux.
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tokio-util = { version = "0.7", features = ["rt"] }
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
png = "0.17"

[dev-dependencies]
pretty_assertions = "1"
rstest = "0.26"
serial_test = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Enables building test-only helper binaries (arborist-test-child,
# arborist-test-locker). Excluded from Tauri release builds to prevent
# the bundler from trying to include them in the app bundle.
test-helpers = []
