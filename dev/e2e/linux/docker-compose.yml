# =============================================================================
# Arborist — Linux e2e Docker Compose
#
# Services:
#   e2e     — Run WebdriverIO specs against the release-built AppImage
#   rust    — Run cargo test --workspace in a clean Linux env
#   vitest  — Run pnpm test -- --run in a clean Linux env
#   shell   — Interactive bash with Xvfb running and AppImage in place
#
# Usage:
#   docker compose -f dev/e2e/linux/docker-compose.yml build
#   docker compose -f dev/e2e/linux/docker-compose.yml run --rm e2e
#   docker compose -f dev/e2e/linux/docker-compose.yml run --rm rust
#   docker compose -f dev/e2e/linux/docker-compose.yml run --rm vitest
#   docker compose -f dev/e2e/linux/docker-compose.yml run --rm shell
# =============================================================================

services:
  # --------------------------------------------------------------------------
  # e2e: WebdriverIO specs against the extracted AppImage under Xvfb
  # --------------------------------------------------------------------------
  e2e:
    build:
      context: ../../..
      dockerfile: dev/e2e/linux/Dockerfile
      target: runtime-e2e
    command: ["e2e"]
    volumes:
      # Bind-mount the entire specs/ directory (which now contains wdio.conf.ts
      # and tsconfig.json alongside the *.spec.ts files). One mount avoids the
      # nested-mount problem that fails on Docker Desktop's 9P filesystem.
      - ./specs:/specs:ro
    environment:
      - ARBORIST_CLI_OVERRIDE_CLAUDE=/usr/local/bin/arborist-test-child
      - ARBORIST_CLI_OVERRIDE_COPILOT=/usr/local/bin/arborist-test-child
      - RUST_LOG=arborist_lib=info
      - WEBKIT_DISABLE_COMPOSITING_MODE=1
    tmpfs:
      - /tmp:exec

  # --------------------------------------------------------------------------
  # rust: cargo test --workspace in a clean Linux environment
  # --------------------------------------------------------------------------
  rust:
    build:
      context: ../../..
      dockerfile: dev/e2e/linux/Dockerfile
      target: runtime-tools
    command: ["rust"]
    volumes:
      # Bind-mount the full source tree
      - ../../..:/src:rw
      # Named volumes isolate Linux build artifacts from Windows host.
      # Cargo target dir is at the workspace root (/src/target), NOT under
      # src-tauri/ — workspace Cargo.toml lives at the repo root.
      - cargo-target-linux:/src/target
      - cargo-cache:/root/.cargo/registry
    tmpfs:
      - /tmp:exec

  # --------------------------------------------------------------------------
  # vitest: pnpm test -- --run in a clean Linux environment
  # --------------------------------------------------------------------------
  vitest:
    build:
      context: ../../..
      dockerfile: dev/e2e/linux/Dockerfile
      target: runtime-tools
    command: ["vitest"]
    volumes:
      - ../../..:/src:rw
      - node-modules-linux:/src/node_modules
    tmpfs:
      - /tmp:exec

  # --------------------------------------------------------------------------
  # shell: interactive bash with Xvfb + AppImage for ad-hoc debugging
  # --------------------------------------------------------------------------
  shell:
    build:
      context: ../../..
      dockerfile: dev/e2e/linux/Dockerfile
      target: runtime-e2e
    command: ["shell"]
    stdin_open: true
    tty: true
    volumes:
      - ./specs:/specs:rw
      - ../../..:/src:ro
    environment:
      - ARBORIST_CLI_OVERRIDE_CLAUDE=/usr/local/bin/arborist-test-child
      - ARBORIST_CLI_OVERRIDE_COPILOT=/usr/local/bin/arborist-test-child
      - RUST_LOG=arborist_lib=debug
      - WEBKIT_DISABLE_COMPOSITING_MODE=1
    tmpfs:
      - /tmp:exec

volumes:
  cargo-target-linux:
  cargo-cache:
  node-modules-linux:
