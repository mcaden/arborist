name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.1.0). The tag must already exist on the repo; this workflow does not create it.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.normalize.outputs.tag }}
    steps:
      # Fail loudly (not silently skip) if the user picked a non-main branch
      # as the workflow source in the Run workflow dialog. Combined with the
      # tag-reachability check below, this prevents shipping a release built
      # from an unmerged or feature-branch commit.
      - name: Assert workflow source is main
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "${REF}" != "refs/heads/main" ]; then
            echo "::error::This workflow must be run from the 'main' branch (got: ${REF}). Re-run from the Actions tab and select 'main' as the workflow source."
            exit 1
          fi
      # Normalize the input: trim whitespace and strip an optional
      # 'refs/tags/' prefix (common when copy-pasting from `git show-ref` or
      # the Actions UI). Reject empty input.
      - name: Normalize tag input
        id: normalize
        env:
          RAW: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$(printf '%s' "${RAW}" | tr -d '[:space:]')"
          tag="${tag#refs/tags/}"
          if [ -z "${tag}" ]; then
            echo "::error::tag input is empty after normalization (raw: '${RAW}'). Provide just the tag name, e.g. 'v0.1.0'."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Normalized tag: '${tag}' (raw: '${RAW}')"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6.0.2
        with:
          ref: main
          fetch-depth: 0
      - name: Assert tag exists and is reachable from main
        env:
          TAG: ${{ steps.normalize.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          if ! git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag '${TAG}' does not exist on origin."
            exit 1
          fi
          tag_sha="$(git rev-list -n 1 "refs/tags/${TAG}")"
          # HEAD is 'main' (checked out above); is_ancestor checks reachability.
          if ! git merge-base --is-ancestor "${tag_sha}" HEAD; then
            echo "::error::Tag '${TAG}' (${tag_sha}) is not reachable from main. Releases must be built from commits on main."
            exit 1
          fi
          echo "Tag ${TAG} (${tag_sha}) is on main — proceeding."

  prepare-release:
    name: Create draft release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6.0.2
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping creation."
          else
            cat <<'EOF' > /tmp/release-notes.md
          See the assets below to download installers for your platform.

          These builds are OS-signed and notarized where each platform
          supports it. See the
          [README](https://github.com/REPO_PLACEHOLDER#install) for
          install instructions on macOS, Windows, and Linux.

          Every published asset has a Sigstore-signed
          [GitHub build attestation](https://github.com/REPO_PLACEHOLDER/attestations).
          Verify a downloaded file with the GitHub CLI:

          ```sh
          gh attestation verify <file> --repo REPO_PLACEHOLDER
          ```
          EOF
            sed -i "s|REPO_PLACEHOLDER|${REPO}|g" /tmp/release-notes.md
            gh release create "$TAG" \
              --draft \
              --title "Arborist ${TAG}" \
              --notes-file /tmp/release-notes.md
          fi

  build:
    name: Build (${{ matrix.platform.name }})
    needs: [verify, prepare-release]
    permissions:
      contents: write
      # Required by actions/attest-build-provenance to mint a short-lived
      # OIDC token and to write the resulting Sigstore-signed attestation
      # back to the repository's attestations store.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        # We pass `--target` explicitly on every platform so the sidecar
        # build (scripts/prepare-claude-hook-sidecar.mjs, which always uses
        # `--target <triple>`) and the main Tauri build share the same
        # `target/<triple>/` directory. Without this, the helper's artifacts
        # land in `target/<triple>/release/` while Tauri's main build (no
        # `--target`) writes to `target/release/`, forcing Cargo to recompile
        # `arborist` and `arborist-types` from scratch a second time.
        platform:
          - name: macos-universal
            os: macos-latest
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            args: '--target universal-apple-darwin'
          - name: linux-x86_64
            os: ubuntu-22.04
            rust-targets: 'x86_64-unknown-linux-gnu'
            args: '--target x86_64-unknown-linux-gnu'
          - name: windows-x86_64
            # windows-latest currently points at a transitional image
            # (windows-2025-vs2026) where WiX v3 light.exe fails at bundle
            # time. Pin to the last known-good image until the image/tooling
            # regression is resolved upstream.
            os: windows-2025
            rust-targets: 'x86_64-pc-windows-msvc'
            args: '--target x86_64-pc-windows-msvc'
    runs-on: ${{ matrix.platform.os }}
    steps:
      # Check out the exact tag the user requested (normalized by the verify
      # job) so the built binaries correspond to the release tag rather than
      # the default branch HEAD.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6.0.2
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}

      - run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Add Rust targets
        if: matrix.platform.rust-targets != ''
        shell: bash
        run: |
          for target in $(echo "${{ matrix.platform.rust-targets }}" | tr ',' ' '); do
            rustup target add "$target"
          done

      - name: Cache Rust dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-release-${{ matrix.platform.name }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-${{ matrix.platform.name }}-cargo-

      # Tauri's Linux build needs system libraries — the baseline list is owned by `rust.yml` (the apt-get step in its `rust` job);
      # this release job extends it with `appstream`. `lld` + `clang` are required by the workspace `.cargo/config.toml` for the
      # faster linker. `appstream` provides `appstreamcli` used by `linuxdeploy-plugin-appimage` to validate the bundled
      # AppStream metainfo file (see `src-tauri/metainfo/`); without it the release log emits "appstreamcli command is missing" — see issue #207.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            appstream

      # macOS: `.cargo/config.toml` sets `-fuse-ld=lld` via per-target
      # rustflags for faster dev builds. GitHub runners don't have lld for
      # Mach-O, so override with RUSTFLAGS (takes precedence over config.toml
      # target rustflags). Empty value = no extra flags → system linker.
      - name: Override macOS linker config for CI
        if: runner.os == 'macOS'
        run: echo "RUSTFLAGS=" >> "$GITHUB_ENV"

      # Prefer runner-installed WiX and only install via Chocolatey when the
      # image does not already include candle.exe.
      - name: Configure WiX toolset for bundling
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          if (-not $candle) {
            choco install wixtoolset --no-progress -y
            $candle = Get-Command candle.exe -ErrorAction Stop
          }
          $wixBin = Split-Path $candle.Source
          $wixRoot = Split-Path $wixBin
          "WIX=$wixRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - run: pnpm install --frozen-lockfile

      - name: Verify version matches tag
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          expected="${TAG#v}"

          # Check all four manifest files that release-prep maintains
          tauri_ver=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version)")
          pkg_ver=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          cargo_ver=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          types_ver=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' crates/arborist-types/Cargo.toml | head -1)

          ok=true
          for pair in "src-tauri/tauri.conf.json:${tauri_ver}" "package.json:${pkg_ver}" "src-tauri/Cargo.toml:${cargo_ver}" "crates/arborist-types/Cargo.toml:${types_ver}"; do
            file="${pair%%:*}"
            ver="${pair#*:}"
            if [ "$ver" != "$expected" ]; then
              echo "::error::Version mismatch in ${file}: expected ${expected} (from tag ${TAG}), got ${ver}."
              ok=false
            fi
          done
          if [ "$ok" = false ]; then
            echo "::error::Run 'pnpm run release:prep ${expected}' to fix all manifests."
            exit 1
          fi
          echo "Version check passed: all manifests at ${expected} match tag ${TAG}"

      # Remove stale bundle artifacts that may have been restored from the
      # Cargo cache. Without this, `find` in "Find release artifacts" can
      # pick up installers from a previous release when Cargo.lock (and
      # therefore the cache key) hasn't changed between versions.
      - name: Clean stale bundle artifacts
        shell: bash
        run: |
          shopt -s nullglob
          rm -rf target/release/bundle
          for d in target/*/release/bundle; do
            rm -rf "$d"
          done

      - name: Build Tauri app
        shell: bash
        # `--verbose` makes the bundler propagate WiX `light.exe` / `candle.exe`
        # stderr (e.g. ICE0204 / LGHT errors) to the workflow log. Without it,
        # MSI bundling failures surface only as the opaque
        # `failed to run … light.exe` line and the actual error is lost.
        run: pnpm tauri build --verbose --config src-tauri/tauri.bundle.conf.json ${{ matrix.platform.args }}

      - name: Find release artifacts
        id: tauri
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Account for --target placing bundles in target/<triple>/release/bundle/
          search_dirs=()
          if [ -d "target/release/bundle" ]; then
            search_dirs+=("target/release/bundle")
          fi
          for d in target/*/release/bundle; do
            search_dirs+=("$d")
          done
          if [ ${#search_dirs[@]} -eq 0 ]; then
            echo "::error::No bundle directories found under target/"
            exit 1
          fi
          artifacts=$(find "${search_dirs[@]}" -type f \( \
            -name "*.msi" -o -name "*.exe" -o -name "*.nsis.zip" \
            -o -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \
            -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \
            -o -name "*.AppImage.tar.gz" -o -name "*.AppImage.tar.gz.sig" \
          \) | tr -d '\r' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          if [ "$(echo "$artifacts" | jq length)" -eq 0 ]; then
            echo "::error::No Tauri release artifacts found"
            exit 1
          fi
          echo "artifactPaths=${artifacts}" >> "$GITHUB_OUTPUT"
          echo "Found $(echo "$artifacts" | jq length) artifact(s)"

      - name: Upload artifacts to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          echo "$ARTIFACT_PATHS" | jq -r '.[]' | tr -d '\r' | while IFS= read -r f; do
            echo "Uploading: $f"
            gh release upload "$TAG" "$f" --clobber
          done

      # Generate a Sigstore-signed SLSA build provenance attestation for
      # every artifact built. Each matrix job attests only the artifacts it
      # built; together the three jobs cover every platform's installers
      # (msi/exe/dmg/deb/AppImage). The attestation is uploaded to GitHub's
      # attestations API and can be verified by users with
      # `gh attestation verify <file> --repo ${{ github.repository }}`.
      #
      # The `artifactPaths` output is a JSON array of file paths; we expand
      # it into the comma-separated form `subject-path` accepts (see
      # actions/attest-build-provenance@v2 README — comma and newline
      # delimited lists are both supported and each entry is trimmed). Tauri
      # bundle filenames never contain commas, so this is unambiguous.
      - name: Attest build provenance for release artifacts
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # actions/attest-build-provenance@v4.1.0
        with:
          subject-path: ${{ join(fromJSON(steps.tauri.outputs.artifactPaths), ',') }}
