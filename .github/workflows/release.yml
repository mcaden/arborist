name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.1.0). The tag must already exist on the repo; this workflow does not create it.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.normalize.outputs.tag }}
    steps:
      # Fail loudly (not silently skip) if the user picked a non-main branch
      # as the workflow source in the Run workflow dialog. Combined with the
      # tag-reachability check below, this prevents shipping a release built
      # from an unmerged or feature-branch commit.
      - name: Assert workflow source is main
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "${REF}" != "refs/heads/main" ]; then
            echo "::error::This workflow must be run from the 'main' branch (got: ${REF}). Re-run from the Actions tab and select 'main' as the workflow source."
            exit 1
          fi
      # Normalize the input: trim whitespace and strip an optional
      # 'refs/tags/' prefix (common when copy-pasting from `git show-ref` or
      # the Actions UI). Reject empty input.
      - name: Normalize tag input
        id: normalize
        env:
          RAW: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$(printf '%s' "${RAW}" | tr -d '[:space:]')"
          tag="${tag#refs/tags/}"
          if [ -z "${tag}" ]; then
            echo "::error::tag input is empty after normalization (raw: '${RAW}'). Provide just the tag name, e.g. 'v0.1.0'."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Normalized tag: '${tag}' (raw: '${RAW}')"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6.0.2
        with:
          ref: main
          fetch-depth: 0
      - name: Assert tag exists and is reachable from main
        env:
          TAG: ${{ steps.normalize.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          if ! git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag '${TAG}' does not exist on origin."
            exit 1
          fi
          tag_sha="$(git rev-list -n 1 "refs/tags/${TAG}")"
          # HEAD is 'main' (checked out above); is_ancestor checks reachability.
          if ! git merge-base --is-ancestor "${tag_sha}" HEAD; then
            echo "::error::Tag '${TAG}' (${tag_sha}) is not reachable from main. Releases must be built from commits on main."
            exit 1
          fi
          echo "Tag ${TAG} (${tag_sha}) is on main — proceeding."

  build:
    name: Build (${{ matrix.platform.name }})
    needs: verify
    permissions:
      contents: write
      # Required by actions/attest-build-provenance to mint a short-lived
      # OIDC token and to write the resulting Sigstore-signed attestation
      # back to the repository's attestations store.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macos-universal
            os: macos-latest
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            args: '--target universal-apple-darwin'
          - name: linux-x86_64
            os: ubuntu-22.04
            rust-targets: ''
            args: ''
          - name: windows-x86_64
            os: windows-latest
            rust-targets: ''
            args: ''
    runs-on: ${{ matrix.platform.os }}
    steps:
      # Check out the exact tag the user requested (normalized by the verify
      # job) so the built binaries correspond to the release tag rather than
      # the default branch HEAD.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6.0.2
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.platform.rust-targets }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      # Tauri's Linux build needs system libraries (must match ci.yml). `lld`
      # + `clang` are required by the workspace `.cargo/config.toml` for the
      # faster linker.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      # macOS: `brew install llvm` provides a recent `lld` that the workspace
      # `.cargo/config.toml` invokes via `clang -fuse-ld=lld`.
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.verify.outputs.tag }}
          releaseName: 'Arborist ${{ needs.verify.outputs.tag }}'
          releaseBody: |
            See the assets below to download installers for your platform.

            **Note:** these builds are not OS code-signed (no Apple
            notarization or Authenticode signature), so each OS will show a
            one-time warning on first launch. See the
            [README](https://github.com/${{ github.repository }}#install) for
            first-run instructions on macOS, Windows, and Linux.

            Every published asset has a Sigstore-signed
            [GitHub build attestation](https://github.com/${{ github.repository }}/attestations).
            Verify a downloaded file with the GitHub CLI:

            ```sh
            gh attestation verify <file> --repo ${{ github.repository }}
            ```
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform.args }}

      # Generate a Sigstore-signed SLSA build provenance attestation for
      # every artifact tauri-action produced. Each matrix job attests only
      # the artifacts it built; together the three jobs cover every
      # platform's installers (msi/exe/dmg/deb/AppImage). The attestation is
      # uploaded to GitHub's attestations API and can be verified by users
      # with `gh attestation verify <file> --repo ${{ github.repository }}`.
      #
      # tauri-action's `artifactPaths` output is a JSON array of file paths;
      # we expand it into the comma-separated form `subject-path` accepts
      # (see actions/attest-build-provenance@v2 README — comma and newline
      # delimited lists are both supported and each entry is trimmed). Tauri
      # bundle filenames never contain commas, so this is unambiguous.
      #
      # No explicit `if:` guard is needed: tauri-action throws when no
      # artifacts are produced (because we set `tagName`), which fails the
      # job and causes this step to be skipped automatically.
      - name: Attest build provenance for release artifacts
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # actions/attest-build-provenance@v4.1.0
        with:
          subject-path: ${{ join(fromJSON(steps.tauri.outputs.artifactPaths), ',') }}
