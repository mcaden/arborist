name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.1.0). The tag must already exist on the repo; this workflow does not create it.'
        required: true
        type: string

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macos-universal
            os: macos-latest
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            args: '--target universal-apple-darwin'
          - name: linux-x86_64
            os: ubuntu-22.04
            rust-targets: ''
            args: ''
          - name: windows-x86_64
            os: windows-latest
            rust-targets: ''
            args: ''
    runs-on: ${{ matrix.platform.os }}
    steps:
      # On workflow_dispatch, check out the exact tag the user requested so
      # the built binaries correspond to the release tag rather than the
      # default branch HEAD. On tag pushes, GITHUB_REF already points at the
      # tag, so the default checkout behaviour is correct.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Tauri's Linux build needs system libraries (must match ci.yml).
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - run: npm ci

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: 'Arborist ${{ steps.tag.outputs.name }}'
          releaseBody: |
            See the assets below to download installers for your platform.

            **Note:** these builds are unsigned. See the
            [README](https://github.com/${{ github.repository }}#install) for
            first-run instructions on macOS, Windows, and Linux.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform.args }}
