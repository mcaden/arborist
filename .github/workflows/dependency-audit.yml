name: Dependency Audits

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/dependabot.yml'
      - '.github/workflows/dependency-audit.yml'
  push:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/dependabot.yml'
      - '.github/workflows/dependency-audit.yml'

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-security:
    name: Rust advisory/license audit
    runs-on: ubuntu-latest
    env:
      CARGO_DENY_VERSION: '0.19.6'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7.0.0
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install cargo-deny
        run: cargo install --locked --version "$CARGO_DENY_VERSION" cargo-deny
      - name: Run cargo-deny checks
        run: cargo deny check advisories licenses

  npm-production:
    name: npm production audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7.0.0
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=moderate
