name: Rust

# Manual / approval-gated. The companion `rust-gate.yml` workflow dispatches
# this workflow against the PR head branch when a reviewer approves the PR;
# `workflow_dispatch` is also kept available for manual re-runs (e.g., after
# a flake) without needing fresh approval.
#
# Why dispatch instead of `pull_request: [labeled]`? Two reasons:
#   1. `pull_request: [labeled]` fires on *any* label, not just a chosen
#      gate label. The job-level `if` would skip for unrelated labels, but
#      GitHub treats skipped checks as passing for required status checks
#      (https://github.com/orgs/community/discussions/13690), which would
#      let any label silently satisfy the gate.
#   2. Dispatching against the PR head ref produces check_runs attached to
#      the PR head SHA, so branch protection enforces them correctly.
on:
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6.0.2
      - run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy
          rustup default stable
      - name: Cache Rust dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # actions/cache@v4.2.3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-stable-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-stable-cargo-
      # Tauri's Linux build needs system libraries even for `cargo check`/test
      # because the `tauri` crate links against webkit2gtk + friends. `lld` +
      # `clang` are required by the workspace `.cargo/config.toml` for the
      # faster linker.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential
      # macOS: `brew install llvm` provides a recent `lld` that the workspace
      # `.cargo/config.toml` invokes via `clang -fuse-ld=lld`. Add llvm's bin
      # dir to PATH so cargo finds it.
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      # `tauri::generate_context!()` validates that `frontendDist` exists at
      # compile time, so the frontend bundle must be built before any cargo
      # command that compiles the `tauri` crate (clippy, test, build). We run
      # `vite build` directly (rather than `pnpm run build`) to skip the
      # project-wide `tsc --noEmit` step — TS typechecking of tests is the
      # frontend job's responsibility, not the rust job's.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features test-helpers -- -D warnings
      - run: cargo test --workspace --features test-helpers
