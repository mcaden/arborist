name: Rust

# Approval-gated via the `rust-ok` label. The companion `rust-gate.yml`
# workflow adds the label when a reviewer approves the PR and removes it on
# any new push. Triggering on `pull_request: [labeled]` (rather than
# `pull_request_review`) is what makes the resulting check_runs attach to
# the PR head SHA, which is required for branch protection enforcement.
#
# `workflow_dispatch` is kept as a manual fallback (e.g., to re-run after a
# flake without needing fresh approval).
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'rust-ok')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # Tauri's Linux build needs system libraries even for `cargo check`/test
      # because the `tauri` crate links against webkit2gtk + friends.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential
      # `tauri::generate_context!()` validates that `frontendDist` exists at
      # compile time, so the frontend bundle must be built before any cargo
      # command that compiles the `tauri` crate (clippy, test, build). We run
      # `vite build` directly (rather than `npm run build`) to skip the
      # project-wide `tsc --noEmit` step — TS typechecking of tests is the
      # frontend job's responsibility, not the rust job's.
      - run: npm ci
      - run: npx vite build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
