name: Rust

# Manual / approval-gated. The companion `rust-gate.yml` workflow dispatches
# this workflow against the PR head branch when a reviewer approves the PR;
# `workflow_dispatch` is also kept available for manual re-runs (e.g., after
# a flake) without needing fresh approval.
#
# Why dispatch instead of `pull_request: [labeled]`? Two reasons:
#   1. `pull_request: [labeled]` fires on *any* label, not just a chosen
#      gate label. The job-level `if` would skip for unrelated labels, but
#      GitHub treats skipped checks as passing for required status checks
#      (https://github.com/orgs/community/discussions/13690), which would
#      let any label silently satisfy the gate.
#   2. Dispatching against the PR head ref produces check_runs attached to
#      the PR head SHA, so branch protection enforces them correctly.
on:
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Tauri's Linux build needs system libraries even for `cargo check`/test
      # because the `tauri` crate links against webkit2gtk + friends.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential
      # `tauri::generate_context!()` validates that `frontendDist` exists at
      # compile time, so the frontend bundle must be built before any cargo
      # command that compiles the `tauri` crate (clippy, test, build). We run
      # `vite build` directly (rather than `pnpm run build`) to skip the
      # project-wide `tsc --noEmit` step — TS typechecking of tests is the
      # frontend job's responsibility, not the rust job's.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features test-helpers -- -D warnings
      - run: cargo test --workspace --features test-helpers
