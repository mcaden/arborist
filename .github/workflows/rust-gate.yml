name: Rust Gate

# Dispatches `rust.yml` against the PR head branch when a reviewer approves
# the PR. The dispatched run produces check_runs attached to the PR head
# SHA, which is what makes branch protection able to require them.
#
# Pair this with branch protection rules:
#   - "Dismiss stale pull request approvals when new commits are pushed"
#     so that any push after approval drops the approval, requiring a fresh
#     review (and therefore a fresh rust dispatch) against the new SHA.
on:
  pull_request_review:
    types: [submitted]

permissions:
  actions: write   # required for `gh workflow run` to create workflow_dispatch
  contents: read

jobs:
  dispatch-rust:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Rust workflow against PR head branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # `--ref` targets the branch; the dispatched run picks up the tip of
        # that branch. We log the SHA at approval time so a reviewer can
        # confirm the run is against the commit they actually approved.
        run: |
          echo "Approved SHA: $PR_HEAD_SHA"
          echo "Dispatching rust.yml against ref: $PR_HEAD_REF"
          gh workflow run rust.yml --ref "$PR_HEAD_REF"
